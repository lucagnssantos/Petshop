<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('petgo-theme')||'light');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetGO - Pet</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="has-background-light">
<div class="container">

  <nav th:replace="~{fragments/navbar :: navbar-voltar('/admin.html')}"></nav>

  <main class="section">
    <div class="container" style="max-width: 560px;">

      <div class="box">
        <div class="has-text-centered mb-5">
          <figure class="image is-128x128 mx-auto mb-3">
            <img id="pet-foto" class="is-rounded" src="https://placehold.co/128x128?text=?" alt="Foto do pet"
                 style="height:128px;width:128px;object-fit:cover;border-radius:50%;" />
          </figure>
          <h1 class="title is-4 mb-1" id="pet-nome">—</h1>
          <p class="is-size-6 has-text-grey" id="pet-raca">—</p>
        </div>

        <div class="columns is-multiline">
          <div class="column is-half">
            <p class="is-size-7 has-text-grey has-text-weight-bold" th:text="#{pet.det.porte}">PORTE</p>
            <p id="pet-porte">—</p>
          </div>
          <div class="column is-half">
            <p class="is-size-7 has-text-grey has-text-weight-bold" th:text="#{pet.det.sexo}">SEXO</p>
            <p id="pet-sexo">—</p>
          </div>
          <div class="column is-half">
            <p class="is-size-7 has-text-grey has-text-weight-bold" th:text="#{pet.det.idade}">IDADE</p>
            <p id="pet-idade">—</p>
          </div>
          <div class="column is-half">
            <p class="is-size-7 has-text-grey has-text-weight-bold" th:text="#{pet.det.tutor}">TUTOR</p>
            <div class="is-flex is-align-items-center" style="gap:0.5rem;">
              <p id="pet-tutor">—</p>
              <a id="pet-tutor-link" class="button is-small is-light is-hidden" title="Ver perfil do tutor" target="_blank">
                <span class="icon"><i class="fas fa-eye"></i></span>
              </a>
            </div>
          </div>
        </div>

        <hr />

        <div id="pet-obs-section">
          <p class="is-size-7 has-text-grey has-text-weight-bold mb-1" th:text="#{pet.det.obs}">OBSERVAÇÕES</p>
          <p id="pet-obs" class="has-text-grey-dark">—</p>
        </div>
      </div>

    </div>
  </main>

  <footer th:replace="~{fragments/footer :: footer}"></footer>

</div>
<script src="/utils.js"></script>
<script src="/scripts.js"></script>
</body>
</html>
