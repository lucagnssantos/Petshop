<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('petgo-theme')||'light');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetGO - Editar Perfil</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="has-background-light">
<div class="container">

  <nav th:replace="~{fragments/navbar :: navbar('/index.html', #{nav.voltar.inicio})}"></nav>

  <main class="section">
    <div class="container" style="max-width: 640px;">

      <div class="is-flex is-align-items-center mb-5" style="gap: 1rem;">
        <a href="/perfil.html" class="button is-light">
          <span class="icon"><i class="fas fa-arrow-left"></i></span>
        </a>
        <h1 class="title is-4 mb-0" th:text="#{editar.titulo}">Editar dados</h1>
      </div>

      <div class="box">
        <div class="columns">
          <div class="column">
            <div class="field">
              <label class="label is-small has-text-primary" th:text="#{editar.nome.label}">Nome Completo</label>
              <div class="control"><input id="edit-nome" class="input" type="text" th:placeholder="#{editar.nome.placeholder}" /></div>
            </div>
          </div>
          <div class="column">
            <div class="field">
              <label class="label is-small has-text-primary" th:text="#{editar.cpf.label}">CPF</label>
              <div class="control"><input id="edit-cpf" class="input" type="text" placeholder="000.000.000-00" /></div>
            </div>
          </div>
        </div>

        <div class="columns">
          <div class="column">
            <div class="field">
              <label class="label is-small has-text-primary" th:text="#{editar.nascimento.label}">Data de Nascimento</label>
              <div class="control"><input id="edit-dataNascimento" class="input" type="text" placeholder="DD/MM/AAAA" /></div>
            </div>
          </div>
          <div class="column">
            <div class="field">
              <label class="label is-small has-text-primary" th:text="#{editar.cep.label}">CEP</label>
              <div class="control"><input id="edit-cep" class="input" type="text" placeholder="00000-000" /></div>
            </div>
          </div>
        </div>

        <div class="columns">
          <div class="column is-8">
            <div class="field">
              <label class="label is-small has-text-primary" th:text="#{editar.endereco.label}">Endereço</label>
              <div class="control"><input id="edit-endereco" class="input" type="text" th:placeholder="#{editar.endereco.placeholder}" /></div>
            </div>
          </div>
          <div class="column">
            <div class="field">
              <label class="label is-small has-text-primary" th:text="#{editar.numero.label}">Número</label>
              <div class="control"><input id="edit-numero" class="input" type="text" placeholder="123" /></div>
            </div>
          </div>
        </div>

        <div class="columns">
          <div class="column">
            <div class="field">
              <label class="label is-small has-text-primary" th:text="#{editar.email.label}">E-mail</label>
              <div class="control"><input id="edit-email" class="input" type="email" placeholder="seu@email.com" /></div>
            </div>
          </div>
          <div class="column is-4">
            <div class="field">
              <label class="label is-small has-text-primary" th:text="#{editar.telefone.label}">Telefone</label>
              <div class="control"><input id="edit-telefone" class="input" type="text" placeholder="(00) 00000-0000" /></div>
            </div>
          </div>
        </div>

        <div class="field">
          <label class="label is-small has-text-primary" th:text="#{editar.foto.label}">Foto de perfil</label>
          <div class="control">
            <input id="edit-inputImagem" class="input" type="file" accept="image/*" onchange="previewImagem(event, 'edit-preview-imagem')" />
          </div>
          <img id="edit-preview-imagem" src="" style="display:none; max-height:80px; margin-top:0.5rem; border-radius:50%;" />
        </div>

        <div class="is-flex is-justify-content-space-between mt-4 form-actions">
          <a href="/perfil.html" class="button is-light" th:text="#{editar.btn.cancelar}">Cancelar</a>
          <button id="btn-salvar" class="button is-primary has-text-weight-bold" th:text="#{editar.btn.salvar}">Salvar alterações</button>
        </div>
      </div>

    </div>
  </main>

  <footer th:replace="~{fragments/footer :: footer}"></footer>

</div>
<script src="https://cdn.jsdelivr.net/npm/imask@7.6.1/dist/imask.min.js"></script>
<script src="/utils.js"></script>
<script src="/scripts.js"></script>
</body>
</html>
