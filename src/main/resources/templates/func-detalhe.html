<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('petgo-theme')||'light');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetGO - Funcionário</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="has-background-light">
<div class="container">

  <nav th:replace="~{fragments/navbar :: navbar-voltar('/admin.html')}"></nav>

  <main class="section">
    <div class="container" style="max-width: 560px;">

      <div class="box is-flex is-align-items-center mb-5" style="gap: 1.5rem;">
        <figure class="image is-96x96" style="flex-shrink:0;">
          <img id="func-foto" class="is-rounded" src="https://placehold.co/96x96?text=?"
            style="width:96px;height:96px;object-fit:cover;border-radius:50%;" />
        </figure>
        <div>
          <p class="title is-4 mb-1" id="func-nome">—</p>
          <p class="subtitle is-6 has-text-primary mb-1" id="func-cargo">—</p>
          <p class="is-size-7 has-text-grey" id="func-email">—</p>
        </div>
      </div>

      <div class="box mb-5">
        <p class="label is-small has-text-grey mb-3" th:text="#{func.det.dados}">DADOS PESSOAIS</p>
        <div class="columns is-multiline">
          <div class="column is-half">
            <p class="is-size-7 has-text-grey has-text-weight-bold" th:text="#{func.det.cpf}">CPF</p>
            <p id="func-cpf">—</p>
          </div>
          <div class="column is-half">
            <p class="is-size-7 has-text-grey has-text-weight-bold" th:text="#{func.det.nascimento}">DATA DE NASCIMENTO</p>
            <p id="func-nascimento">—</p>
          </div>
          <div class="column is-half">
            <p class="is-size-7 has-text-grey has-text-weight-bold" th:text="#{func.det.telefone}">TELEFONE</p>
            <p id="func-telefone">—</p>
          </div>
        </div>
      </div>

      <div class="box">
        <p class="label is-small has-text-grey mb-3" th:text="#{func.det.ags}">AGENDAMENTOS ATRIBUÍDOS</p>
        <div class="table-container">
        <table class="table is-fullwidth is-hoverable is-striped is-size-7">
          <thead>
            <tr>
              <th th:text="#{func.det.tabela.data}">Data</th>
              <th th:text="#{func.det.tabela.pet}">Pet</th>
              <th th:text="#{func.det.tabela.servico}">Serviço</th>
              <th th:text="#{func.det.tabela.status}">Status</th>
            </tr>
          </thead>
          <tbody id="func-ags-tbody"></tbody>
        </table>
        </div>
        <p id="func-ags-vazio" class="has-text-grey is-hidden" th:text="#{func.det.ags.vazio}">Nenhum agendamento atribuído.</p>
      </div>

    </div>
  </main>

  <footer th:replace="~{fragments/footer :: footer}"></footer>

</div>
<div id="petgo-i18n" hidden
     th:data-status-agendado="#{status.agendado}"
     th:data-status-concluido="#{status.concluido}"
     th:data-status-cancelado="#{status.cancelado}"
     th:data-cargo-vet="#{admin.func.cargo.vet}"
     th:data-cargo-esteticista="#{admin.func.cargo.esteticista}"
     th:data-cargo-atendente="#{admin.func.cargo.atendente}"
     th:data-servico-banho="#{servico.nome.banho}"
     th:data-servico-tosa="#{servico.nome.tosa}"
     th:data-servico-corteunha="#{servico.nome.corteunha}"
     th:data-servico-desembolamento="#{servico.nome.desembolamento}"
     th:data-servico-hidratacao="#{servico.nome.hidratacao}"
     th:data-servico-consulta="#{servico.nome.consulta}"
     th:data-servico-vacinacao="#{servico.nome.vacinacao}"></div>
<script src="/utils.js"></script>
<script src="/scripts.js"></script>
</body>
</html>
