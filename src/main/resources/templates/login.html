<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('petgo-theme')||'light');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetGO - Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="has-background-light">
<div class="container" style="min-height: 100vh; display: flex; flex-direction: column;">

  <nav th:replace="~{fragments/navbar :: navbar('/index.html', #{nav.voltar.inicio})}"></nav>

  <main class="section" style="flex: 1;">
    <div class="container" style="max-width: 420px;">

      <h1 class="title is-3 has-text-centered has-text-weight-bold mb-2" th:text="#{login.titulo}">Entrar</h1>
      <p class="has-text-centered mb-5 is-size-7">
        <span th:text="#{login.sem.cadastro}">Não tem cadastro?</span> <a href="/cadastro.html" class="has-text-primary has-text-weight-bold" th:text="#{login.cadastrar}">Cadastre-se aqui</a>
      </p>

      <div class="field">
        <div class="control">
          <input id="email" class="input" type="email" placeholder="JoãodaSilvaSantosPerreira@Email.com" />
        </div>
        <label class="label is-small has-text-primary" th:text="#{login.email.label}">Email</label>
      </div>

      <div class="field">
        <div class="control has-icons-right" style="position: relative;">
          <input id="senha" class="input" type="password" placeholder="*******************" style="padding-right: 45px;" />
          <button type="button" id="toggleSenha" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:none;cursor:pointer;">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div class="is-flex is-justify-content-space-between is-align-items-center mb-5">
          <label class="label is-small has-text-primary mb-0" th:text="#{login.senha.label}">Senha</label>
          <a href="#" class="is-size-7 has-text-primary" th:text="#{login.esqueci.senha}">Esqueci minha senha</a>
        </div>
      </div>

      <div class="has-text-centered">
        <button id="btnLogin" class="button is-primary has-text-weight-bold px-6" th:text="#{login.btn}">Entrar</button>
      </div>

    </div>
  </main>

  <footer th:replace="~{fragments/footer :: footer}"></footer>

</div>
<script src="/utils.js"></script>
<script src="/scripts.js"></script>
</body>
</html>
