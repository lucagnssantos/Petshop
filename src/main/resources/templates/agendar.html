<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetGO - Agendar Serviço</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="has-background-light">
<div class="container">

  <nav th:replace="~{fragments/navbar :: navbar('/perfil.html', 'Voltar ao perfil')}"></nav>

  <main class="section">
    <div class="container" style="max-width: 640px;">

      <h1 class="title is-4 has-text-centered has-text-weight-bold has-text-primary mb-5">Agendar serviço</h1>

      <div class="box">

        <div class="field">
          <label class="label is-small has-text-primary">Pet</label>
          <div class="control">
            <div class="select is-fullwidth">
              <select id="agendar-pet">
                <option value="">Selecione o pet</option>
              </select>
            </div>
          </div>
        </div>

        <div class="field">
          <label class="label is-small has-text-primary">Serviços</label>
          <div id="agendar-servicos" class="columns is-multiline is-mobile" style="gap:0;"></div>
        </div>

        <div class="columns">
          <div class="column">
            <div class="field">
              <label class="label is-small has-text-primary">Data</label>
              <div class="control">
                <input id="agendar-data" class="input" type="date" />
              </div>
            </div>
          </div>
          <div class="column">
            <div class="field">
              <label class="label is-small has-text-primary">Horário</label>
              <div class="control">
                <div class="select is-fullwidth">
                  <select id="agendar-hora">
                    <option value="">Selecione</option>
                    <option value="08:00">08:00</option>
                    <option value="09:00">09:00</option>
                    <option value="10:00">10:00</option>
                    <option value="11:00">11:00</option>
                    <option value="12:00">12:00</option>
                    <option value="13:00">13:00</option>
                    <option value="14:00">14:00</option>
                    <option value="15:00">15:00</option>
                    <option value="16:00">16:00</option>
                    <option value="17:00">17:00</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="field">
          <label class="label is-small has-text-primary">Observação</label>
          <div class="control">
            <textarea id="agendar-observacao" class="textarea" rows="3" placeholder="Alguma informação importante sobre o seu pet..."></textarea>
          </div>
        </div>

        <div class="is-flex is-justify-content-space-between mt-5">
          <a href="/perfil.html#agendamentos" class="button is-light">Cancelar</a>
          <button id="btn-agendar" class="button is-primary has-text-weight-bold">Confirmar agendamento</button>
        </div>

      </div>
    </div>
  </main>

  <footer th:replace="~{fragments/footer :: footer}"></footer>

</div>
<script src="/scripts.js"></script>
</body>
</html>
