<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('petgo-theme')||'light');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetGO - Cliente</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="has-background-light">
<div class="container">

  <nav th:replace="~{fragments/navbar :: navbar-voltar('/admin.html')}"></nav>

  <main class="section">
    <div class="container" style="max-width: 680px;">

      <div class="box is-flex is-align-items-center mb-5" style="gap: 1.5rem;">
        <figure class="image is-96x96" style="flex-shrink:0;">
          <img id="cli-foto" class="is-rounded" src="https://placehold.co/96x96?text=?"
            style="width:96px;height:96px;object-fit:cover;border-radius:50%;" />
        </figure>
        <div>
          <p class="title is-4 mb-1" id="cli-nome">—</p>
          <p class="subtitle is-6 has-text-grey mb-0" id="cli-email">—</p>
        </div>
      </div>

      <div class="box mb-5">
        <p class="label is-small has-text-grey mb-3" th:text="#{cli.dados.pessoais}">DADOS PESSOAIS</p>
        <div class="columns is-multiline">
          <div class="column is-half">
            <p class="is-size-7 has-text-grey has-text-weight-bold" th:text="#{cli.cpf}">CPF</p>
            <p id="cli-cpf">—</p>
          </div>
          <div class="column is-half">
            <p class="is-size-7 has-text-grey has-text-weight-bold" th:text="#{cli.nascimento}">DATA DE NASCIMENTO</p>
            <p id="cli-nascimento">—</p>
          </div>
          <div class="column is-half">
            <p class="is-size-7 has-text-grey has-text-weight-bold" th:text="#{cli.cep}">CEP</p>
            <p id="cli-cep">—</p>
          </div>
          <div class="column is-half">
            <p class="is-size-7 has-text-grey has-text-weight-bold" th:text="#{cli.numero}">NÚMERO</p>
            <p id="cli-numero">—</p>
          </div>
          <div class="column is-full">
            <p class="is-size-7 has-text-grey has-text-weight-bold" th:text="#{cli.endereco}">ENDEREÇO</p>
            <p id="cli-endereco">—</p>
          </div>
          <div class="column is-half">
            <p class="is-size-7 has-text-grey has-text-weight-bold" th:text="#{cli.telefone}">TELEFONE</p>
            <p id="cli-telefone">—</p>
          </div>
        </div>
      </div>

      <div class="box mb-5">
        <p class="label is-small has-text-grey mb-3" th:text="#{cli.pets}">PETS</p>
        <div id="cli-pets-lista"></div>
        <p id="cli-pets-vazio" class="has-text-grey is-hidden" th:text="#{cli.pets.vazio}">Nenhum pet cadastrado.</p>
      </div>

      <div class="box">
        <p class="label is-small has-text-grey mb-3" th:text="#{cli.agendamentos}">AGENDAMENTOS</p>
        <div class="table-container">
        <table class="table is-fullwidth is-hoverable is-striped is-size-7">
          <thead>
            <tr>
              <th th:text="#{cli.tabela.data}">Data</th>
              <th th:text="#{cli.tabela.pet}">Pet</th>
              <th th:text="#{cli.tabela.servico}">Serviço</th>
              <th th:text="#{cli.tabela.status}">Status</th>
            </tr>
          </thead>
          <tbody id="cli-ags-tbody"></tbody>
        </table>
        </div>
        <p id="cli-ags-vazio" class="has-text-grey is-hidden" th:text="#{cli.ags.vazio}">Nenhum agendamento encontrado.</p>
      </div>

    </div>
  </main>

  <footer th:replace="~{fragments/footer :: footer}"></footer>

</div>
<script src="/utils.js"></script>
<script src="/scripts.js"></script>
</body>
</html>
