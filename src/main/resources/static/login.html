<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetGO - Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="has-background-light">
<div class="container" style="min-height: 100vh; display: flex; flex-direction: column;">

  <nav class="navbar" role="navigation">
    <div class="navbar-menu">
      <div class="navbar-start">
        <a class="navbar-item has-text-weight-bold" href="index.html">Voltar ao Início</a>
      </div>
      <div class="nav-logo">
        <a class="navbar-item" href="index.html">
          <img src="https://placehold.co/120x60?text=PetGO" alt="PetGO logo" />
        </a>
      </div>
      <div class="navbar-end"></div>
    </div>
  </nav>

  <main class="section" style="flex: 1;">
    <div class="container" style="max-width: 420px;">

      <h1 class="title is-3 has-text-centered has-text-weight-bold mb-2">Entrar</h1>
      <p class="has-text-centered mb-5 is-size-7">
        Não tem cadastro? <a href="cadastro.html" class="has-text-primary has-text-weight-bold">Cadastre-se aqui</a>
      </p>

      <div class="field">
        <div class="control">
          <input id="email" class="input" type="email" placeholder="JoãodaSilvaSantosPerreira@Email.com" />
        </div>
        <label class="label is-small has-text-primary">Email</label>
      </div>

      <div class="field">

        <div class="control has-icons-right" style="position: relative;">

          <input
                  id="senha"
                  class="input"
                  type="password"
                  placeholder="*******************"
                  style="padding-right: 45px;"
          />

          <button
                  type="button"
                  id="toggleSenha"
                  style="
                    position:absolute;
                    right:10px;
                    top:50%;
                    transform:translateY(-50%);
                     border:none;
                    background:none;
                    cursor:pointer;
                  "
          >
            <i class="fas fa-eye"></i>
          </button>

        </div>

        <div class="is-flex is-justify-content-space-between is-align-items-center mb-5">
          <label class="label is-small has-text-primary mb-0">Senha</label>
          <a href="#" class="is-size-7 has-text-primary">Esqueci minha senha</a>
        </div>

      </div>

      <div class="has-text-centered">
        <button id="btnLogin" class="button is-primary has-text-weight-bold px-6">Entrar</button>
      </div>


    </div>
  </main>

  <footer class="footer has-background-white py-5">
    <div class="container">
      <div class="has-text-centered mb-4">
        <img src="https://placehold.co/60x60?text=PetGO" alt="PetGO logo" />
      </div>
      <hr />
      <div class="columns is-vcentered">
        <div class="column has-text-weight-bold">
          <p>PetGO Serviços de Petshop</p>
        </div>
        <div class="column has-text-centered has-text-weight-bold">
          <p>Rua Maria da Silva Santos, 8888</p>
        </div>
        <div class="column is-flex is-align-items-center is-justify-content-flex-end has-text-weight-bold" style="gap: 1rem;">
          <p>+55555555555555</p>
          <div class="buttons mb-0">
            <a class="button" href="#"><span class="icon has-text-primary"><i class="fab fa-instagram"></i></span></a>
            <a class="button" href="#"><span class="icon has-text-primary"><i class="fab fa-facebook"></i></span></a>
            <a class="button" href="#"><span class="icon has-text-primary"><i class="fab fa-whatsapp"></i></span></a>
            <a class="button" href="#"><span class="icon has-text-primary"><i class="fab fa-tiktok"></i></span></a>
          </div>
        </div>
      </div>
    </div>
  </footer>

</div>
<script src="scripts.js"></script>
</body>
</html>
