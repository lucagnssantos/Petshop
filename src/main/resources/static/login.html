<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Teste Login Petshop</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; }
    .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 300px; }
    input { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>

<div class="card">
  <h3>Login Petshop</h3>
  <input type="email" id="email" placeholder="E-mail" value="teste@puc.br">
  <input type="password" id="senha" placeholder="Senha" value="123">
  <button onclick="efetuarLogin()">Entrar</button>
  <p id="msg"></p>
</div>

<script>
  async function efetuarLogin() {
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const msg = document.getElementById('msg');

      try {
          const response = await fetch('http://localhost:8080/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: email, senha: senha })
          });

          if (response.ok) {
              const data = await response.json();

              // 1. SALVA O TOKEN
              localStorage.setItem('token_petshop', data.token);

              // 2. REDIRECIONA PARA A DASHBOARD (Crie esse arquivo também na pasta static)
              window.location.href = "dashboard.html";

          } else {
              msg.style.color = "red";
              msg.innerText = "Erro: Usuário ou senha inválidos.";
          }
      } catch (error) {
          msg.innerText = "Erro: O servidor Java está rodando?";
          console.error(error);
      }
  }
</script>
</body>
</html>
