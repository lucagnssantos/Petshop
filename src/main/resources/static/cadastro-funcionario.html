<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetGO - Cadastrar Funcionário</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="has-background-light">
<div id="pagina-cadastro-funcionario">

  <div class="is-flex" style="min-height: 100vh;">

    <!-- Sidebar admin -->
    <aside class="has-background-white" style="width: 220px; flex-shrink: 0; padding: 2rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; border-right: 1px solid #eee;">
      <div class="has-text-centered mb-5">
        <img src="https://placehold.co/100x50?text=PetGO" alt="PetGO" />
        <p class="is-size-7 has-text-grey mt-2">Painel Admin</p>
      </div>
      <a class="navbar-item" href="admin.html">
        <span class="icon mr-2"><i class="fas fa-chart-bar"></i></span> Dashboard
      </a>
      <a class="navbar-item is-active has-text-weight-bold" href="cadastro-funcionario.html">
        <span class="icon mr-2"><i class="fas fa-user-plus"></i></span> Novo Funcionário
      </a>
      <div style="margin-top: auto;">
        <button id="btn-sair-admin" class="button is-danger is-outlined is-fullwidth is-small">
          <span class="icon"><i class="fas fa-sign-out-alt"></i></span>
          <span>Sair</span>
        </button>
      </div>
    </aside>

    <!-- Conteúdo -->
    <main class="p-5" style="flex: 1;">

      <div class="is-flex is-align-items-center mb-5" style="gap: 1rem;">
        <a href="admin.html" class="button is-light">
          <span class="icon"><i class="fas fa-arrow-left"></i></span>
        </a>
        <h1 class="title is-4 mb-0">Cadastrar Funcionário</h1>
      </div>

      <div class="box" style="max-width: 640px;">

        <div class="columns">
          <div class="column">
            <div class="field">
              <label class="label is-small has-text-primary">Nome Completo</label>
              <div class="control"><input id="func-nome" class="input" type="text" placeholder="Nome do funcionário" /></div>
            </div>
          </div>
          <div class="column">
            <div class="field">
              <label class="label is-small has-text-primary">CPF</label>
              <div class="control"><input id="func-cpf" class="input" type="text" placeholder="000.000.000-00" /></div>
            </div>
          </div>
        </div>

        <div class="columns">
          <div class="column">
            <div class="field">
              <label class="label is-small has-text-primary">Cargo</label>
              <div class="control">
                <div class="select is-fullwidth" id="wrap-func-cargo">
                  <select id="func-cargo">
                    <option value="">Selecione o cargo</option>
                    <option value="Veterinário">Veterinário</option>
                    <option value="Esteticista">Esteticista</option>
                    <option value="Atendente">Atendente</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
          <div class="column">
            <div class="field">
              <label class="label is-small has-text-primary">Data de Nascimento</label>
              <div class="control"><input id="func-dataNascimento" class="input" type="text" placeholder="DD/MM/AAAA" /></div>
            </div>
          </div>
        </div>

        <div class="field">
          <label class="label is-small has-text-primary">E-mail</label>
          <div class="control"><input id="func-email" class="input" type="email" placeholder="funcionario@petgo.com" /></div>
        </div>

        <div class="columns">
          <div class="column">
            <div class="field">
              <label class="label is-small has-text-primary">Senha</label>
              <div class="control"><input id="func-senha" class="input" type="password" placeholder="*********" /></div>
            </div>
          </div>
          <div class="column">
            <div class="field">
              <label class="label is-small has-text-primary">Confirmar Senha</label>
              <div class="control"><input id="func-senhaRepetida" class="input" type="password" placeholder="*********" /></div>
            </div>
          </div>
        </div>

        <div class="is-flex is-justify-content-space-between mt-4">
          <a href="admin.html" class="button is-light">Cancelar</a>
          <button id="btn-cadastrar-funcionario" class="button is-primary has-text-weight-bold">Cadastrar</button>
        </div>

      </div>
    </main>
  </div>

</div>
<script src="https://unpkg.com/imask"></script>
<script src="scripts.js"></script>
</body>
</html>
