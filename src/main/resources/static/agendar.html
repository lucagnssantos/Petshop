<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetGO - Agendar Serviço</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="has-background-light">
<div class="container">

  <nav class="navbar" role="navigation">
    <div class="navbar-menu">
      <div class="navbar-start">
        <a class="navbar-item" href="perfil.html">Voltar ao perfil</a>
      </div>
      <div class="nav-logo">
        <a class="navbar-item" href="index.html">
          <img src="https://pub-ff62bf51a3fa432ab455c83ccd93e3a1.r2.dev/logo-vertical.svg" alt="PetGO logo" style="height:60px;width:auto;" />
        </a>
      </div>
      <div class="navbar-end">
        <div class="navbar-item" id="nav-btn-entrar">
          <a href="login.html" class="button is-primary is-outlined has-text-weight-bold">Entrar/Cadastrar</a>
        </div>
        <div class="navbar-item is-flex is-align-items-center is-hidden" id="nav-usuario" style="gap: 0.5rem;">
          <span class="has-text-grey">Olá, <a href="perfil.html" class="has-text-primary has-text-weight-bold" id="nav-nome">...</a></span>
          <figure class="image is-40x40">
            <img id="nav-avatar" class="is-rounded" src="https://placehold.co/40x40?text=?" alt="Avatar" style="height:40px;object-fit:cover;" />
          </figure>
        </div>
      </div>
    </div>
  </nav>

  <main class="section">
    <div class="container" style="max-width: 640px;">

      <h1 class="title is-4 has-text-centered has-text-weight-bold has-text-primary mb-5">Agendar serviço</h1>

      <div class="box">

        <!-- Pet -->
        <div class="field">
          <label class="label is-small has-text-primary">Pet</label>
          <div class="control">
            <div class="select is-fullwidth">
              <select id="agendar-pet">
                <option value="">Selecione o pet</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Serviços -->
        <div class="field">
          <label class="label is-small has-text-primary">Serviços</label>
          <div id="agendar-servicos" class="columns is-multiline is-mobile" style="gap:0;"></div>
        </div>

        <!-- Data e Hora -->
        <div class="columns">
          <div class="column">
            <div class="field">
              <label class="label is-small has-text-primary">Data</label>
              <div class="control">
                <input id="agendar-data" class="input" type="date" />
              </div>
            </div>
          </div>
          <div class="column">
            <div class="field">
              <label class="label is-small has-text-primary">Horário</label>
              <div class="control">
                <div class="select is-fullwidth">
                  <select id="agendar-hora">
                    <option value="">Selecione</option>
                    <option value="08:00">08:00</option>
                    <option value="09:00">09:00</option>
                    <option value="10:00">10:00</option>
                    <option value="11:00">11:00</option>
                    <option value="12:00">12:00</option>
                    <option value="13:00">13:00</option>
                    <option value="14:00">14:00</option>
                    <option value="15:00">15:00</option>
                    <option value="16:00">16:00</option>
                    <option value="17:00">17:00</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Observação -->
        <div class="field">
          <label class="label is-small has-text-primary">Observação</label>
          <div class="control">
            <textarea id="agendar-observacao" class="textarea" rows="3" placeholder="Alguma informação importante sobre o seu pet..."></textarea>
          </div>
        </div>

        <div class="is-flex is-justify-content-space-between mt-5">
          <a href="perfil.html#agendamentos" class="button is-light">Cancelar</a>
          <button id="btn-agendar" class="button is-primary has-text-weight-bold">Confirmar agendamento</button>
        </div>

      </div>
    </div>
  </main>

  <footer class="footer has-background-white py-5">
    <div class="container">
      <div class="has-text-centered mb-4">
        <img src="https://pub-ff62bf51a3fa432ab455c83ccd93e3a1.r2.dev/logo-vertical.svg" alt="PetGO logo" style="height:36px;width:auto;" />
      </div>
      <hr />
      <div class="columns is-vcentered">
        <div class="column has-text-weight-bold">
          <p>PetGO Serviços de Petshop</p>
        </div>
        <div class="column has-text-centered has-text-weight-bold">
          <p>Rua Maria da Silva Santos, 8888</p>
        </div>
        <div class="column is-flex is-align-items-center is-justify-content-flex-end has-text-weight-bold" style="gap: 1rem;">
          <p>+55555555555555</p>
          <div class="buttons mb-0">
            <a class="button" href="#"><span class="icon has-text-primary"><i class="fab fa-instagram"></i></span></a>
            <a class="button" href="#"><span class="icon has-text-primary"><i class="fab fa-facebook"></i></span></a>
            <a class="button" href="#"><span class="icon has-text-primary"><i class="fab fa-whatsapp"></i></span></a>
            <a class="button" href="#"><span class="icon has-text-primary"><i class="fab fa-tiktok"></i></span></a>
          </div>
        </div>
      </div>
    </div>
  </footer>

</div>
<script src="scripts.js"></script>
</body>
</html>
