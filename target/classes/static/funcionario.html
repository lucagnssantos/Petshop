<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetGO - Área do Funcionário</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="has-background-light">
<div id="funcionario-dashboard">

  <div class="is-flex" style="min-height: 100vh;">

    <!-- Sidebar -->
    <aside class="has-background-white" style="width: 220px; flex-shrink: 0; padding: 2rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; border-right: 1px solid #eee;">
      <div class="has-text-centered mb-5">
        <img src="https://placehold.co/100x50?text=PetGO" alt="PetGO" />
        <figure class="image is-64x64 mx-auto mt-3">
          <img id="func-avatar" class="is-rounded" src="https://placehold.co/64x64?text=?" alt="Avatar" style="height:64px;object-fit:cover;border-radius:50%;" />
        </figure>
        <p class="has-text-weight-bold mt-2" id="func-nome-nav">...</p>
        <p class="is-size-7 has-text-grey" id="func-cargo-nav">...</p>
      </div>

      <a class="navbar-item is-active" href="#" data-secao-func="agenda">
        <span class="icon mr-2"><i class="fas fa-calendar-day"></i></span> Minha Agenda
      </a>
      <a class="navbar-item" href="#" data-secao-func="perfil">
        <span class="icon mr-2"><i class="fas fa-user"></i></span> Meu Perfil
      </a>
      <button id="btn-sair-funcionario" class="navbar-item has-text-danger" style="background:none;border:none;cursor:pointer;width:100%;text-align:left;">
        <span class="icon mr-2"><i class="fas fa-sign-out-alt"></i></span> Sair
      </button>
    </aside>

    <!-- Conteúdo principal -->
    <main class="p-5" style="flex: 1;">

      <!-- Seção: Agenda -->
      <div id="section-func-agenda">
        <h1 class="title is-4 mb-1">Minha Agenda</h1>
        <p class="has-text-grey mb-5">Agendamentos atribuídos a você</p>
        <div class="box p-0">
          <table class="table is-fullwidth is-hoverable is-striped">
            <thead>
              <tr>
                <th>Data</th>
                <th>Horário</th>
                <th>Cliente</th>
                <th>Pet</th>
                <th>Serviço</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-func-agenda"></tbody>
          </table>
          <p id="func-agenda-vazio" class="has-text-centered has-text-grey py-4 is-hidden">Nenhum agendamento encontrado.</p>
        </div>
      </div>

      <!-- Seção: Perfil -->
      <div id="section-func-perfil" class="is-hidden">
        <h1 class="title is-4 mb-5">Meu Perfil</h1>
        <div class="box" style="max-width: 520px;">
          <div class="columns">
            <div class="column">
              <p class="is-size-7 has-text-primary has-text-weight-bold mb-1">Nome</p>
              <p id="fp-nome">—</p>
            </div>
            <div class="column">
              <p class="is-size-7 has-text-primary has-text-weight-bold mb-1">Cargo</p>
              <p id="fp-cargo">—</p>
            </div>
          </div>
          <hr class="my-3" />
          <div class="columns">
            <div class="column">
              <p class="is-size-7 has-text-primary has-text-weight-bold mb-1">CPF</p>
              <p id="fp-cpf">—</p>
            </div>
            <div class="column">
              <p class="is-size-7 has-text-primary has-text-weight-bold mb-1">Data de Nascimento</p>
              <p id="fp-dataNascimento">—</p>
            </div>
          </div>
          <hr class="my-3" />
          <div class="columns">
            <div class="column">
              <p class="is-size-7 has-text-primary has-text-weight-bold mb-1">E-mail</p>
              <p id="fp-email">—</p>
            </div>
            <div class="column">
              <p class="is-size-7 has-text-primary has-text-weight-bold mb-1">Telefone</p>
              <p id="fp-telefone">—</p>
            </div>
          </div>
          <div class="mt-5">
            <button id="btn-editar-func-perfil" class="button is-primary is-outlined">
              <span class="icon"><i class="fas fa-pen"></i></span>
              <span>Editar dados</span>
            </button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- Modal: Editar Perfil -->
  <div id="modal-editar-func" class="modal">
    <div class="modal-background"></div>
    <div class="modal-card">
      <header class="modal-card-head">
        <p class="modal-card-title">Editar Perfil</p>
        <button class="delete" id="fechar-modal-editar-func"></button>
      </header>
      <section class="modal-card-body">

        <div class="is-flex is-align-items-center mb-5" style="gap: 1.5rem;">
          <figure class="image" style="width:80px;height:80px;flex-shrink:0;">
            <img id="modal-func-avatar-preview" class="is-rounded" src="" alt="Foto" style="width:80px;height:80px;object-fit:cover;border-radius:50%;" />
          </figure>
          <div class="file is-small">
            <label class="file-label">
              <input class="file-input" type="file" id="modal-func-foto" accept="image/*">
              <span class="file-cta">
                <span class="file-icon"><i class="fas fa-upload"></i></span>
                <span class="file-label">Alterar foto</span>
              </span>
            </label>
          </div>
        </div>

        <div class="columns">
          <div class="column">
            <div class="field">
              <label class="label is-small">Nome Completo</label>
              <input class="input" type="text" id="modal-func-nome" autocomplete="off" />
            </div>
          </div>
          <div class="column is-4">
            <div class="field">
              <label class="label is-small has-text-grey">Cargo <span class="tag is-light is-small ml-1">somente leitura</span></label>
              <input class="input" type="text" id="modal-func-cargo" readonly />
            </div>
          </div>
        </div>

        <div class="columns">
          <div class="column">
            <div class="field">
              <label class="label is-small has-text-grey">CPF <span class="tag is-light is-small ml-1">somente leitura</span></label>
              <input class="input" type="text" id="modal-func-cpf" readonly />
            </div>
          </div>
          <div class="column">
            <div class="field">
              <label class="label is-small has-text-grey">Data de Nascimento <span class="tag is-light is-small ml-1">somente leitura</span></label>
              <input class="input" type="text" id="modal-func-dataNascimento" readonly />
            </div>
          </div>
        </div>

        <div class="columns">
          <div class="column">
            <div class="field">
              <label class="label is-small">E-mail</label>
              <input class="input" type="email" id="modal-func-email" autocomplete="off" />
            </div>
          </div>
          <div class="column">
            <div class="field">
              <label class="label is-small">Telefone</label>
              <input class="input" type="text" id="modal-func-telefone" autocomplete="off" placeholder="(00) 00000-0000" />
            </div>
          </div>
        </div>

      </section>
      <footer class="modal-card-foot is-flex is-justify-content-flex-end" style="gap: 0.5rem;">
        <button class="button" id="cancelar-modal-editar-func">Cancelar</button>
        <button class="button is-primary" id="btn-salvar-func-perfil">Salvar</button>
      </footer>
    </div>
  </div>

</div>
<script src="scripts.js"></script>
</body>
</html>
