<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetGO - Cliente</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="has-background-light">
<div class="container">

  <nav class="navbar" role="navigation">
    <div class="navbar-menu">
      <div class="navbar-start">
        <a class="navbar-item has-text-weight-bold" href="admin.html">Voltar</a>
      </div>
      <div class="nav-logo">
        <a class="navbar-item" href="index.html">
          <img src="https://placehold.co/120x60?text=PetGO" alt="PetGO logo" />
        </a>
      </div>
      <div class="navbar-end"></div>
    </div>
  </nav>

  <main class="section">
    <div class="container" style="max-width: 680px;">

      <!-- Cabeçalho -->
      <div class="box is-flex is-align-items-center mb-5" style="gap: 1.5rem;">
        <figure class="image is-96x96" style="flex-shrink:0;">
          <img id="cli-foto" class="is-rounded" src="https://placehold.co/96x96?text=?"
            style="width:96px;height:96px;object-fit:cover;border-radius:50%;" />
        </figure>
        <div>
          <p class="title is-4 mb-1" id="cli-nome">—</p>
          <p class="subtitle is-6 has-text-grey mb-0" id="cli-email">—</p>
        </div>
      </div>

      <!-- Dados pessoais -->
      <div class="box mb-5">
        <p class="label is-small has-text-grey mb-3">DADOS PESSOAIS</p>
        <div class="columns is-multiline">
          <div class="column is-half">
            <p class="is-size-7 has-text-grey has-text-weight-bold">CPF</p>
            <p id="cli-cpf">—</p>
          </div>
          <div class="column is-half">
            <p class="is-size-7 has-text-grey has-text-weight-bold">DATA DE NASCIMENTO</p>
            <p id="cli-nascimento">—</p>
          </div>
          <div class="column is-half">
            <p class="is-size-7 has-text-grey has-text-weight-bold">CEP</p>
            <p id="cli-cep">—</p>
          </div>
          <div class="column is-half">
            <p class="is-size-7 has-text-grey has-text-weight-bold">NÚMERO</p>
            <p id="cli-numero">—</p>
          </div>
          <div class="column is-full">
            <p class="is-size-7 has-text-grey has-text-weight-bold">ENDEREÇO</p>
            <p id="cli-endereco">—</p>
          </div>
          <div class="column is-half">
            <p class="is-size-7 has-text-grey has-text-weight-bold">TELEFONE</p>
            <p id="cli-telefone">—</p>
          </div>
        </div>
      </div>

      <!-- Pets -->
      <div class="box mb-5">
        <p class="label is-small has-text-grey mb-3">PETS</p>
        <div id="cli-pets-lista"></div>
        <p id="cli-pets-vazio" class="has-text-grey is-hidden">Nenhum pet cadastrado.</p>
      </div>

      <!-- Agendamentos -->
      <div class="box">
        <p class="label is-small has-text-grey mb-3">AGENDAMENTOS</p>
        <table class="table is-fullwidth is-hoverable is-striped is-size-7">
          <thead>
            <tr>
              <th>Data</th>
              <th>Pet</th>
              <th>Serviço</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="cli-ags-tbody"></tbody>
        </table>
        <p id="cli-ags-vazio" class="has-text-grey is-hidden">Nenhum agendamento encontrado.</p>
      </div>

    </div>
  </main>

  <footer class="footer has-background-white py-5">
    <div class="container">
      <div class="has-text-centered mb-4">
        <img src="https://placehold.co/60x60?text=PetGO" alt="PetGO logo" />
      </div>
      <hr />
      <div class="columns is-vcentered">
        <div class="column has-text-weight-bold"><p>PetGO Serviços de Petshop</p></div>
        <div class="column has-text-centered has-text-weight-bold"><p>Rua Maria da Silva Santos, 8888</p></div>
        <div class="column is-flex is-align-items-center is-justify-content-flex-end has-text-weight-bold" style="gap: 1rem;">
          <p>+55555555555555</p>
          <div class="buttons mb-0">
            <a class="button" href="#"><span class="icon has-text-primary"><i class="fab fa-instagram"></i></span></a>
            <a class="button" href="#"><span class="icon has-text-primary"><i class="fab fa-facebook"></i></span></a>
            <a class="button" href="#"><span class="icon has-text-primary"><i class="fab fa-whatsapp"></i></span></a>
            <a class="button" href="#"><span class="icon has-text-primary"><i class="fab fa-tiktok"></i></span></a>
          </div>
        </div>
      </div>
    </div>
  </footer>

</div>
<script>
  const BASE_URL = "http://localhost:8080";
  const auth = () => ({ "Authorization": "Bearer " + (localStorage.getItem("petgo_token") || "") });
  const params = new URLSearchParams(window.location.search);
  const clienteId = params.get("id");

  if (!clienteId) window.location.href = "admin.html";

  function fmtData(d) {
    if (!d) return "—";
    const [y, m, dia] = d.split("-");
    return `${dia}/${m}/${y}`;
  }

  function tagStatus(s) {
    const map = { "Agendado": "is-primary", "Concluído": "is-success", "Cancelado": "is-danger" };
    return `<span class="tag ${map[s] || "is-light"} is-light">${s}</span>`;
  }

  fetch(`${BASE_URL}/api/usuarios/${clienteId}`, { headers: auth() })
    .then(r => r.ok ? r.json() : null)
    .then(u => {
      if (!u) return;
      document.title = `PetGO - ${u.nome}`;
      document.getElementById("cli-nome").textContent = u.nome || "—";
      document.getElementById("cli-email").textContent = u.email || "—";
      document.getElementById("cli-cpf").textContent = u.cpf || "—";
      document.getElementById("cli-nascimento").textContent = u.dataNascimento || "—";
      document.getElementById("cli-cep").textContent = u.cep || "—";
      document.getElementById("cli-numero").textContent = u.numero || "—";
      document.getElementById("cli-endereco").textContent = u.endereco || "—";
      document.getElementById("cli-telefone").textContent = u.telefone || "—";

      const foto = document.getElementById("cli-foto");
      foto.src = u.imagemUrl || `https://placehold.co/96x96?text=${(u.nome||"?")[0].toUpperCase()}`;
    });

  fetch(`${BASE_URL}/api/pets/usuario/${clienteId}`, { headers: auth() })
    .then(r => r.ok ? r.json() : [])
    .then(pets => {
      const lista = document.getElementById("cli-pets-lista");
      const vazio = document.getElementById("cli-pets-vazio");
      if (!pets || pets.length === 0) { vazio.classList.remove("is-hidden"); return; }
      pets.forEach(p => {
        const div = document.createElement("div");
        div.className = "is-flex is-align-items-center mb-2";
        div.style.gap = "0.75rem";
        const img = document.createElement("img");
        img.className = "is-rounded";
        img.style.cssText = "width:40px;height:40px;object-fit:cover;border-radius:50%;flex-shrink:0;";
        img.src = p.imagemUrl || `https://placehold.co/40x40?text=${(p.nome||"?")[0].toUpperCase()}`;
        const info = document.createElement("span");
        info.innerHTML = `<strong>${p.nome}</strong> <span class="has-text-grey">${p.raca || ""} · ${p.porte || ""} · ${p.sexo || ""}</span>`;
        const link = document.createElement("a");
        link.href = `pet.html?id=${p.id}`;
        link.className = "button is-small is-light ml-auto";
        link.title = "Ver pet";
        link.target = "_blank";
        link.innerHTML = `<span class="icon"><i class="fas fa-eye"></i></span>`;
        div.appendChild(img);
        div.appendChild(info);
        div.appendChild(link);
        lista.appendChild(div);
      });
    });

  fetch(`${BASE_URL}/api/agendamentos/usuario/${clienteId}`, { headers: auth() })
    .then(r => r.ok ? r.json() : [])
    .then(ags => {
      const tbody = document.getElementById("cli-ags-tbody");
      const vazio = document.getElementById("cli-ags-vazio");
      const hoje = new Date().toLocaleDateString("en-CA");
      const futuros = (ags || []).filter(ag => ag.data >= hoje);
      if (futuros.length === 0) { vazio.classList.remove("is-hidden"); return; }
      futuros.sort((a, b) => a.data.localeCompare(b.data) || (a.hora || "").localeCompare(b.hora || "")).forEach(ag => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${fmtData(ag.data)} ${ag.hora || ""}</td><td>${ag.petNome || "—"}</td><td>${ag.servico || "—"}</td><td>${tagStatus(ag.status)}</td>`;
        tbody.appendChild(tr);
      });
    });
</script>
</body>
</html>
